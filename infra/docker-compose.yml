services:
  postgres:
    image: postgres:16-alpine
    container_name: operaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-operaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operaia}
      POSTGRES_DB: ${POSTGRES_DB:-operaia_lab}
    ports:
      - "5432:5432"
    volumes:
      - operaia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operaia} -d ${POSTGRES_DB:-operaia_lab}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  operaia_pgdata:
    name: operaia_pgdata
