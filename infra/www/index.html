<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OperaIA</title>
    <meta
      name="description"
      content="OperaIA — organizacao digital autonoma."
    />
    <style>
      :root {
        --bg: #0b1220;
        --fg: #e8eef8;
        --muted: #9aa8bd;
        --accent: #6ea8fe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #152238, var(--bg));
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      h1 {
        font-size: 2.4rem;
        letter-spacing: 0.04em;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.55;
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        margin: 0 0.75rem;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OperaIA</h1>
      <p>
        Organizacao digital autonoma. O laboratorio operacional esta em
        <strong>lab.operaia.com.br</strong>.
      </p>
      <p>
        <a href="https://lab.operaia.com.br">Abrir Lab</a>
        <a href="https://status.operaia.com.br">Status</a>
        <a href="https://api.operaia.com.br/api/v1/health">API Health</a>
      </p>
    </main>
  </body>
</html>
