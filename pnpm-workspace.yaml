packages:
  - "apps/*"
  - "packages/*"
  - "packages/employees/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma

verifyDepsBeforeRun: false
allowBuilds:
  '@google/genai': set this to true or false
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  protobufjs: set this to true or false
